# V2 AI Bot log rotation config
# Force run: logrotate --force --state ~/.logrotate_v2_state "/home/wali/Desktop/AI BOT REBUILD/.claude/logrotate_v2.conf"
# Cron: every 15 min via tools/disk_monitor.sh (at >=85% disk usage)
# Daily cron: 0 3 * * * logrotate --state /home/wali/.logrotate_v2_state "/home/wali/Desktop/AI BOT REBUILD/.claude/logrotate_v2.conf"

# Control plane — 20MB cap catches high-churn chart publisher and all others
"/home/wali/Desktop/AI BOT REBUILD/claude_worklog/agent_supervisor/logs/control_plane/*.log"
"/home/wali/Desktop/AI BOT REBUILD/claude_worklog/agent_supervisor/logs/control_plane/*.err"
{
    daily
    rotate 2
    size 20M
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
    dateext
    dateformat -%Y%m%d
}

# V2 rebuild runtime logs
"/home/wali/Desktop/AI BOT REBUILD/logs/*.log"
{
    daily
    rotate 5
    size 100M
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
    dateext
    dateformat -%Y%m%d
}

# Legacy logs (no active writers)
"/home/wali/Desktop/AI BOT - Legacy/.logs/*.log"
{
    daily
    rotate 1
    size 100M
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
    dateext
    dateformat -%Y%m%d
}
