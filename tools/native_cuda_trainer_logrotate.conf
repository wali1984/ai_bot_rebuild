# Logrotate config for the V2 native CUDA trainer logs.
# Rollover enabled with a ~100GB total budget:
#   rotate at 2G, keep 50 rotations -> ~100GB per stream, then oldest is dropped.
# copytruncate is REQUIRED: the trainer holds the log open via systemd
# StandardOutput=append, so we copy-then-truncate-in-place instead of renaming,
# keeping the writer's file descriptor valid.
"/home/wali/Desktop/AI BOT REBUILD/claude_worklog/agent_supervisor/logs/control_plane/ai-bot-v2-native-cuda-trainer-persistent.log"
"/home/wali/Desktop/AI BOT REBUILD/claude_worklog/agent_supervisor/logs/control_plane/ai-bot-v2-native-cuda-trainer-persistent.err"
{
    size 2G
    rotate 50
    copytruncate
    missingok
    notifempty
    compress
    delaycompress
    nodateext
}
