name: AIBotV2
options:
  bundleIdPrefix: com.wali1984
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "15"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "5"
    ENABLE_BITCODE: NO

targets:

  AIBotV2Core:
    type: framework
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/AIBotV2Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wali1984.aibot-v2.core
        SKIP_INSTALL: YES
        BUILD_LIBRARY_FOR_DISTRIBUTION: NO

  AIBotV2:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/AIBotV2
        excludes:
          - "Info.plist"   # referenced via INFOPLIST_FILE, not a regular source
    dependencies: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wali1984.aibot-v2
        INFOPLIST_FILE: Sources/AIBotV2/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
