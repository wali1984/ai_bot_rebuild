# AI BOT V2 — CI workflow
#
# This file is the canonical CI definition for the v2 control plane. It is
# materialized under v2/.github/workflows/ to stay within the writable
# boundary declared by CLAUDE.md ("./v2/**"). To activate it on GitHub it
# must be installed at the repository root (.github/workflows/ci.yml) by an
# operator with broader perms — typically:
#
#   mkdir -p .github/workflows && \
#   ln -sf ../../v2/.github/workflows/ci.yml .github/workflows/ci.yml
#
# Local-native by construction: no Docker required for any required stage,
# no legacy Redis / DB / exchange access, no trainer-venv mutation.

name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  V2_MODE: paper
  V2_REDIS_PREFIX: "v2:test"

jobs:
  lint:
    name: lint (B)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install backend dev deps
        working-directory: v2
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Run lint
        run: bash v2/ops/ci/lint.sh

  type:
    name: type (B)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install backend dev deps
        working-directory: v2
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: v2/frontend/package.json
      - name: Install frontend deps
        working-directory: v2/frontend
        run: npm install --no-audit --no-fund
      - name: Run type check
        run: bash v2/ops/ci/type_check.sh

  import-cycle:
    name: import-cycle (B)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install backend dev deps
        working-directory: v2
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Run import-cycle check
        run: python v2/ops/ci/import_cycle_check.py

  schema-drift:
    name: schema-drift (advisory until 015C)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install backend dev deps
        working-directory: v2
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Run schema-drift check
        run: python v2/ops/ci/schema_drift_check.py

  orphan-path:
    name: orphan-path (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run orphan-path check
        run: python v2/ops/ci/orphan_path_check.py

  unit:
    name: unit (C)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install backend dev deps
        working-directory: v2
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Pytest unit
        run: bash v2/ops/ci/test.sh unit

  integration:
    name: integration (C)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: v2_test
          POSTGRES_USER: v2
          POSTGRES_PASSWORD: v2
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U v2 -d v2_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://v2:v2@localhost:5432/v2_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install backend dev deps
        working-directory: v2
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Pytest integration
        run: bash v2/ops/ci/test.sh integration

  contract:
    name: contract (D)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install backend dev deps
        working-directory: v2
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Pytest contract
        run: bash v2/ops/ci/test.sh contract

  frontend-unit:
    name: frontend-unit (E)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: v2/frontend/package.json
      - name: Install frontend deps
        working-directory: v2/frontend
        run: npm install --no-audit --no-fund
      - name: Frontend unit (vitest)
        run: bash v2/ops/ci/test.sh frontend-unit

  e2e:
    name: e2e (E)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: v2/frontend/package.json
      - name: Install frontend deps
        working-directory: v2/frontend
        run: npm install --no-audit --no-fund
      - name: Install Playwright browsers
        working-directory: v2/frontend
        run: npx playwright install --with-deps chromium
      - name: Playwright e2e
        run: bash v2/ops/ci/test.sh e2e

  a11y:
    name: a11y (advisory until F)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "[ci/a11y] axe-core gating deferred to milestone F per 015E §13."
          echo "[ci/a11y] structural a11y (semantic landmarks, aria-disabled) is honored in the shell."

  coverage:
    name: coverage (advisory until C)
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: [unit, integration]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install backend dev deps
        working-directory: v2
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev] coverage pytest-cov
      - name: Coverage (advisory in milestone B)
        working-directory: v2
        run: |
          pytest --cov=app --cov-report=term-missing backend/tests || true
          echo "[ci/coverage] advisory in milestone B; >= 80% domain gate enforced from milestone C."

  security-audit:
    name: security-audit (advisory until H)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: pip-audit
        run: |
          pip install pip-audit
          cd v2 && pip-audit --strict || true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: npm audit
        working-directory: v2/frontend
        run: npm audit --omit=dev || true

  secrets-scan:
    name: secrets-scan (B)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          GL_VERSION="8.18.4"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GL_VERSION}/gitleaks_${GL_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan
        run: bash v2/ops/ci/secrets_scan.sh

  ci-required:
    name: ci-required
    runs-on: ubuntu-latest
    needs:
      - lint
      - type
      - import-cycle
      - unit
      - integration
      - contract
      - frontend-unit
      - e2e
      - secrets-scan
    steps:
      - run: echo "All required CI stages for milestone B passed."
